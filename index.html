<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Augmium AR Test</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <style>

        body {
            margin: 0;
            overflow: hidden;
        }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;

            padding: 10px 16px;

            background: rgba(0, 0, 0, 0.7);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 14px;

            border-radius: 20px;

            pointer-events: none;
        }

    </style>

</head>

<body>

    <a-scene

        webxr="
            mode: inline;
            optionalFeatures: hit-test;
            referenceSpaceType: local;
        "

        xr-mode-ui="
            enabled: true;
            XRMode: ar;
        "

    vr-mode-ui="enabled: false"
    renderer="alpha: true"
    
    ar-hit-test="
        target: #cube;
        type: footprint;
    ">

        <a-box

            id="cube"

            visible="false"

            scale="0.2 0.2 0.2"

            color="#D4AF37"
        >
        </a-box>


        <a-camera></a-camera>


    </a-scene>

<script>

    const scene = document.querySelector('a-scene');

    const status = document.querySelector('#status');


    scene.addEventListener('ar-hit-test-start', () => {

        status.textContent = 'SURFACE: SEARCHING...';

    });


    scene.addEventListener('ar-hit-test-achieved', () => {

        status.textContent = 'SURFACE: FOUND ✓  —  TAP TO PLACE';

    });


    scene.addEventListener('ar-hit-test-select', () => {

        status.textContent = 'PLACED ✓';

    });

</script>

</body>

<div id="status">
    SURFACE: SEARCHING...
</div>

</html>
